spring.application.name=civic-connect-backend
server.port=8080

spring.datasource.url=jdbc:sqlserver://localhost;instanceName=MSSQLSERVER01;databaseName=civic_connect;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=civicuser
spring.datasource.password=Saurabh
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# --- Default: in-memory H2 for quick local run ---
#spring.datasource.url=jdbc:h2:mem:civicconnect;DB_CLOSE_DELAY=-1
#spring.datasource.driver-class-name=org.h2.Driver
