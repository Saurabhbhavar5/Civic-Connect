# --- Switch to MySQL for production: comment H2 above, uncomment below ---
# spring.datasource.url=jdbc:mysql://localhost:3306/civic_connect?useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password

# File uploads (complaint photos)
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS - allow the React dev server
app.cors.allowed-origins=http://localhost:3000

# JWT
app.jwt.secret=civicConnectSuperSecretKeyChangeThisInProduction123456
app.jwt.expiration-ms=86400000
